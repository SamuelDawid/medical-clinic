databaseChangeLog:
  - changeSet:
      id: 006-create-institution-table
      author: Samuel Dawid
      comment: "institution table"
      changes:
        - createTable:
            tableName: INSTITUTION
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_institutions
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
              - column:
                  name: address_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    unique: true
                    foreignKeyName: fk_institutions_address
                    references: address(id)