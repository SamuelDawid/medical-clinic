databaseChangeLog:
  - changeSet:
      id: 007-create-appointment-table
      author: Samuel Dawid
      comment: "Create appointment table"
      changes:
        - createTable:
            tableName: APPOINTMENT
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_appointments
              - column:
                  name: start_date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: APPOINTMENT
            baseColumnNames: patient_id
            referencedTableName: PATIENT
            referencedColumnNames: id
            constraintName: fk_patient_appointment
        - addForeignKeyConstraint:
            baseTableName: APPOINTMENT
            baseColumnNames: doctor_id
            referencedTableName: DOCTOR
            referencedColumnNames: id
            constraintName: fk_doctor_appointment