databaseChangeLog:
  - changeSet:
      id: 007-create-appointment-table
      author: Samuel Dawid
      comment: "Create appointment table"
      changes:
        - createTable:
            tableName: APPOINTMENT
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_appointments
              - column:
                  name: start_date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_patient_appointment
                    referencedTableName: PATIENT
                    referencedColumnNames: id
                    references: patient(id)
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_doctor_appointment
                    referencedTableName: DOCTOR
                    referencedColumnNames: id
                    references: patient(id)